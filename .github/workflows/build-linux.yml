name: Build & Sign Linux Packages

on:
  push:
    branches: [ master ]
  workflow_dispatch:

permissions:
  id-token: write   # нужно для keyless-подписи через GitHub OIDC
  contents: read

jobs:
  build-linux:
    runs-on: ubuntu-latest
    name: Build, Package & Sign

    steps:
      - name: 🧱 Checkout repository
        uses: actions/checkout@v4

      - name: ⚙️ Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: 📦 Install dependencies
        run: |
          sudo apt update
          sudo apt install -y wget dpkg-dev libfuse2

          # AppImage tool
          wget https://github.com/AppImage/AppImageKit/releases/download/continuous/appimagetool-x86_64.AppImage
          chmod +x appimagetool-x86_64.AppImage
          sudo mv appimagetool-x86_64.AppImage /usr/local/bin/appimagetool

          # Cosign
          curl -Lo cosign https://github.com/sigstore/cosign/releases/latest/download/cosign-linux-amd64
          chmod +x cosign
          sudo mv cosign /usr/local/bin/cosign

      - name: 🏗️ Build AppImage & DEB
        run: |
          chmod +x UnderMine/build-packages.sh
          ./UnderMine/build-packages.sh

      - name: 🔐 Sign artifacts with GitHub OIDC (Cosign keyless)
        env:
          COSIGN_EXPERIMENTAL: "true"
        run: |
          for file in ./*.AppImage ./*.deb; do
            if [ -f "$file" ]; then
              echo "🔏 Signing $file ..."
              cosign sign-blob "$file" \
                --yes \
                --bundle "$file.bundle.json" \
                --output-signature "$file.sig"
            fi
          done

      - name: 📤 Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: UnderMineLauncher-Linux
          path: |
            ./*.AppImage
            ./*.AppImage.sig
            ./*.deb
            ./*.deb.sig
