name: Build macOS PKG for UnderMine

on:
  push:
    tags:
      - 'v*.*.*'  # Workflow запускается только на теги вида v1.0.0

jobs:
  build:
    runs-on: macos-latest

    steps:
      # 1️⃣ Скачиваем репозиторий
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2️⃣ Устанавливаем .NET SDK
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x

      # 3️⃣ Публикуем Avalonia приложение для macOS
      - name: Publish Avalonia app (macOS universal)
        run: |
          # Сборка для Intel
          dotnet publish UnderMine/UnderMine.csproj \
            -c Release \
            -r osx-x64 \
            --self-contained true \
            /p:PublishTrimmed=false \
            /p:DebugType=None \
            /p:IncludeNativeLibrariesForSelfExtract=true
          # Сборка для Apple Silicon
          dotnet publish UnderMine/UnderMine.csproj \
            -c Release \
            -r osx-arm64 \
            --self-contained true \
            /p:PublishTrimmed=false \
            /p:DebugType=None \
            /p:IncludeNativeLibrariesForSelfExtract=true

      # 4️⃣ Создаём структуру .app
      - name: Create .app bundle
        run: |
          mkdir -p UnderMine.app/Contents/MacOS
          mkdir -p UnderMine.app/Contents/Resources
          # Копируем ARM64 сборку
          cp -R UnderMine/bin/Release/net9.0/osx-arm64/publish/* UnderMine.app/Contents/MacOS/
          # Создаём Info.plist
          cat > UnderMine.app/Contents/Info.plist <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>CFBundleDisplayName</key>
              <string>UnderMine</string>
              <key>CFBundleIdentifier</key>
              <string>com.undermine.app</string>
              <key>CFBundleVersion</key>
              <string>${GITHUB_REF#refs/tags/}</string>
              <key>CFBundleExecutable</key>
              <string>UnderMine</string>
              <key>CFBundlePackageType</key>
              <string>APPL</string>
          </dict>
          </plist>
          EOF
          chmod +x UnderMine.app/Contents/MacOS/UnderMine

      # 5️⃣ Подготовка payload для pkg
      - name: Prepare pkg payload
        run: |
          mkdir -p payload/Applications
          cp -R UnderMine.app payload/Applications/

      # 6️⃣ Сборка .pkg установщика
      - name: Build PKG
        run: |
          PKG_NAME="UnderMine_${GITHUB_REF#refs/tags/}_macOS.pkg"
          pkgbuild \
            --root payload \
            --identifier com.undermine.pkg \
            --version ${GITHUB_REF#refs/tags/} \
            "$PKG_NAME"
          echo "PKG_NAME=$PKG_NAME" >> $GITHUB_ENV

      # 7️⃣ Публикация в GitHub Release
      - name: Create GitHub Release & upload PKG
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ env.PKG_NAME }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
