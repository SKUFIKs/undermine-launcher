name: Build macOS PKG for UnderMine

on:
  push:
    tags:
      - 'v*.*.*'

jobs:
  build:
    runs-on: macos-latest

    steps:
      # 1️⃣ Скачиваем репозиторий
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2️⃣ Устанавливаем .NET SDK
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x

      # 3️⃣ Публикуем Avalonia приложение для macOS
      - name: Publish Avalonia app (macOS universal)
        run: |
          # Сборка для Intel
          dotnet publish UnderMine/UnderMine.csproj \
            -c Release \
            -r osx-x64 \
            --self-contained true \
            /p:PublishTrimmed=false \
            /p:DebugType=None \
            /p:IncludeNativeLibrariesForSelfExtract=true

          # Сборка для Apple Silicon
          dotnet publish UnderMine/UnderMine.csproj \
            -c Release \
            -r osx-arm64 \
            --self-contained true \
            /p:PublishTrimmed=false \
            /p:DebugType=None \
            /p:IncludeNativeLibrariesForSelfExtract=true

      # 4️⃣ Создаём структуру .app
      - name: Create .app bundle
        run: |
          mkdir -p UnderMine.app/Contents/MacOS
          mkdir -p UnderMine.app/Contents/Resources

          # Копируем ARM64 сборку
          cp -R UnderMine/bin/Release/net9.0/osx-arm64/publish/* UnderMine.app/Contents/MacOS/

          # Создаём Info.plist
          cat > UnderMine.app/Contents/Info.plist <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>CFBundleDisplayName</key>
              <string>UnderMine</string>
              <key>CFBundleIdentifier</key>
              <string>com.undermine.app</string>
              <key>CFBundleVersion</key>
              <string>1.0.0</string>
              <key>CFBundleExecutable</key>
              <string>UnderMine</string>
              <key>CFBundlePackageType</key>
              <string>APPL</string>
          </dict>
          </plist>
          EOF

          chmod +x UnderMine.app/Contents/MacOS/UnderMine

      # 5️⃣ Подготовка payload для pkg
      - name: Prepare pkg payload
        run: |
          mkdir -p payload/Applications
          cp -R UnderMine.app payload/Applications/

      # 6️⃣ Сборка .pkg установщика
      - name: Build PKG
        run: |
          pkgbuild \
            --root payload \
            --identifier com.undermine.pkg \
            --version 1.0.0 \
            UnderMine_1.0.0_macOS.pkg

      # 7️⃣ Загрузка артефакта для скачивания
      # Вставить после сборки .pkg
      - name: Create GitHub Release & upload PKG
        uses: softprops/action-gh-release@v2
        with:
          files: UnderMine_1.0.0_macOS.pkg
        env:
          GITHUB_TOKEN: ${{ secrets.RELEASE_TOKEN }}

      - name: Upload PKG to Release
        uses: actions/upload-release-asset@v1
        with:
            upload_url: ${{ steps.create_release.outputs.upload_url }}
            asset_path: UnderMine_1.0.0_macOS.pkg
            asset_name: UnderMine_1.0.0_macOS.pkg
            asset_content_type: application/octet-stream

