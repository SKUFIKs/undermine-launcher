name: Build macOS App

on:
  push:
    tags:
      - 'v*'

env:
  APP_NAME: UnderMine

jobs:
  build-macos:
    runs-on: macos-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v3
      with:
        dotnet-version: '9.0.x'

    - name: Extract version from tag
      run: echo "VERSION=${GITHUB_REF#refs/tags/v}" >> $GITHUB_ENV

    - name: Publish Application
      run: |
        dotnet publish -c Release -r osx-x64 -p:UseAppHost=true -o ./publish

    - name: Create .app Bundle
      run: |
        mkdir -p UnderMine.app/Contents/MacOS
        mkdir -p UnderMine.app/Contents/Resources
        cp -R ./publish/osx-x64/* UnderMine.app/Contents/MacOS/
        if [ -f "./icon.icns" ]; then
          cp ./icon.icns UnderMine.app/Contents/Resources/
        else
          touch UnderMine.app/Contents/Resources/icon.icns
        fi

    - name: Create Info.plist
      run: |
        cat > UnderMine.app/Contents/Info.plist << EOF
        <?xml version="1.0" encoding="UTF-8"?>
        <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
        <plist version="1.0">
        <dict>
          <key>CFBundleName</key>
          <string>UnderMine</string>
          <key>CFBundleDisplayName</key>
          <string>UnderMine</string>
          <key>CFBundleIdentifier</key>
          <string>com.underground.undermine</string>
          <key>CFBundleVersion</key>
          <string>${{ env.VERSION }}</string>
          <key>CFBundlePackageType</key>
          <string>APPL</string>
          <key>CFBundleSignature</key>
          <string>????</string>
          <key>CFBundleExecutable</key>
          <string>UnderMine</string>
          <key>CFBundleIconFile</key>
          <string>icon.icns</string>
          <key>NSPrincipalClass</key>
          <string>NSApplication</string>
          <key>NSHighResolutionCapable</key>
          <true/>
          <key>CFBundleShortVersionString</key>
          <string>${{ env.VERSION }}</string>
          <key>LSMinimumSystemVersion</key>
          <string>10.15</string>
        </dict>
        </plist>
        EOF

    - name: Set Executable Permissions
      run: chmod +x UnderMine.app/Contents/MacOS/UnderMine

    - name: Zip .app for Release
      run: zip -r UnderMine-macOS-${{ env.VERSION }}.zip UnderMine.app

    - name: Create GitHub Release
      id: release
      uses: actions/create-release@v1
      with:
        tag_name: ${{ github.ref_name }}
        release_name: Release ${{ github.ref_name }}
        draft: false
        prerelease: false
      env:
        GITHUB_TOKEN: ${{ secrets.RELEASE_TOKEN }}

    - name: Upload .app ZIP to Release
      uses: actions/upload-release-asset@v1
      with:
        upload_url: ${{ steps.release.outputs.upload_url }}
        asset_path: ./UnderMine-macOS-${{ env.VERSION }}.zip
        asset_name: UnderMine-macOS-${{ env.VERSION }}.zip
        asset_content_type: application/zip
        token: ${{ secrets.RELEASE_TOKEN }}
