name: Build macOS App

on:
  push:
    tags:
      - 'v*'

env:
  APP_NAME: UnderMine

jobs:
  build-macos:
    runs-on: macos-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v3
      with:
        dotnet-version: '9.0.x'

    - name: Extract version from tag
      run: echo "VERSION=${GITHUB_REF#refs/tags/v}" >> $GITHUB_ENV

    - name: Publish Application
      run: |
        dotnet publish -c Release -r osx-x64 -p:UseAppHost=true -o ./publish

    - name: Create .app Bundle
      run: |
        mkdir -p UnderMine.app/Contents/MacOS
        mkdir -p UnderMine.app/Contents/Resources
        cp -R ./publish/osx-x64/* UnderMine.app/Contents/MacOS/
        if [ -f "./icon.icns" ]; then
          cp ./icon.icns UnderMine.app/Contents/Resources/
        else
          touch UnderMine.app/Contents/Resources/icon.icns
        fi

    - name: Create Info.plist
      run: |
        cat > UnderMine.app/Contents/Info.plist << EOF
        <?xml version="1.0" encoding="UTF-8"?>
        <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
        <plist version="1.0">
        <dict>
          <key>CFBundleName</key>
          <string>UnderMine</string>
          <key>CFBundleDisplayName</key>
          <string>UnderMine</string>
          <key>CFBundleIdentifier</key>
          <string>com.underground.undermine</string>
          <key>CFBundleVersion</key>
          <string>${{ env.VERSION }}</string>
          <key>CFBundlePackageType</key>
          <string>APPL</string>
          <key>CFBundleSignature</key>
          <string>????</string>
          <key>CFBundleExecutable</key>
          <string>UnderMine</string>
          <key>CFBundleIconFile</key>
          <string>icon.icns</string>
          <key>NSPrincipalClass</key>
          <string>NSApplication</string>
          <key>NSHighResolutionCapable</key>
          <true/>
          <key>CFBundleShortVersionString</key>
          <string>${{ env.VERSION }}</string>
          <key>LSMinimumSystemVersion</key>
          <string>10.15</string>
        </dict>
        </plist>
        EOF

    - name: Set Executable Permissions
      run: chmod +x UnderMine.app/Contents/MacOS/UnderMine

    - name: Zip .app for Release
      run: zip -r UnderMine-macOS-${{ env.VERSION }}.zip UnderMine.app

    - name: Install GitHub CLI
      run: brew install gh

    - name: Create or Update GitHub Release
      run: |
        gh release create ${{ github.ref_name }} ./UnderMine-macOS-${{ env.VERSION }}.zip \
          --title "Release ${{ github.ref_name }}" \
          --notes "Automated release for version ${{ env.VERSION }}" \
          --repo ${{ github.repository }} \
          --target ${{ github.sha }} \
          --draft
      env:
        GITHUB_TOKEN: ${{ secrets.RELEASE_TOKEN }}
