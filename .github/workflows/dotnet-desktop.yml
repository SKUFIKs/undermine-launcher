name: Build UnderMineLauncher AppImage

on:
  push:
    tags:
      - 'v*.*.*'  # срабатывает на теги вида v1.0.0

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      Solution_Name: UnderMine.sln
      App_Project_Path: UnderMine/UnderMine.csproj
      App_Name: UnderMineLaunche

    steps:
    - name: Checkout
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Setup .NET 9
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 9.0.x

    - name: Restore dependencies
      run: dotnet restore ${{ env.Solution_Name }}

    - name: Publish Linux binary
      run: dotnet publish ${{ env.App_Project_Path }} -c Release -r linux-x64 --self-contained true /p:PublishSingleFile=true -o publish

    - name: Prepare AppDir
      run: |
        mkdir -p ${{ env.App_Name }}.AppDir/usr/bin
        cp publish/${{ env.App_Name }} ${{ env.App_Name }}.AppDir/usr/bin/
        echo -e '#!/bin/bash\nHERE="$(dirname "$(readlink -f "${0}")")"\nexec "$HERE/usr/bin/${{ env.App_Name }}" "$@"' > ${{ env.App_Name }}.AppDir/AppRun
        chmod +x ${{ env.App_Name }}.AppDir/AppRun
        echo -e "[Desktop Entry]\nName=${{ env.App_Name }}\nExec=${{ env.App_Name }}\nType=Application\nCategories=Utility;" > ${{ env.App_Name }}.AppDir/${{ env.App_Name }}.desktop

    - name: Install AppImageTool
      run: |
        wget -O appimagetool.AppImage https://github.com/AppImage/AppImageKit/releases/download/continuous/appimagetool-x86_64.AppImage
        chmod +x appimagetool.AppImage

    - name: Get version from tag
      id: get_version
      run: echo "VERSION=${GITHUB_REF#refs/tags/}" >> $GITHUB_ENV

    - name: Build AppImage
      run: |
        ARCH=x86_64
        ./appimagetool.AppImage ${{ env.App_Name }}.AppDir ${{ env.App_Name }}-${{ env.VERSION }}-$ARCH.AppImage

    - name: Generate SHA256 checksum
      run: sha256sum ${{ env.App_Name }}-${{ env.VERSION }}-x86_64.AppImage > ${{ env.App_Name }}-${{ env.VERSION }}-x86_64.AppImage.sha256

    - name: Create GitHub Release
      uses: softprops/action-gh-release@v1
      with:
        tag_name: ${{ github.ref_name }}
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    - name: Upload AppImage to Release
      uses: softprops/action-gh-release@v1
      with:
        tag_name: ${{ github.ref_name }}
        name: ${{ env.App_Name }}-${{ env.VERSION }}-x86_64.AppImage
        asset_path: ${{ env.App_Name }}-${{ env.VERSION }}-x86_64.AppImage

    - name: Upload SHA256 checksum to Release
      uses: softprops/action-gh-release@v1
      with:
        tag_name: ${{ github.ref_name }}
        name: ${{ env.App_Name }}-${{ env.VERSION }}-x86_64.AppImage.sha256
        asset_path: ${{ env.App_Name }}-${{ env.VERSION }}-x86_64.AppImage.sha256

