name: .NET Avalonia AppImage

on:
  push:
    tags:
      - 'v*.*.*'  # срабатывает на теги вида v1.0.0
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        configuration: [Release]

    env:
      Solution_Name: UnderMineLauncher.sln          # замените на своё решение
      App_Project_Path: src/UnderMineLauncher/UnderMineLauncher.csproj  # путь к проекту Avalonia
      App_Name: UnderMineLauncher

    steps:
    - name: Checkout
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Setup .NET 9
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 9.0.x

    - name: Restore dependencies
      run: dotnet restore ${{ env.Solution_Name }}

    - name: Publish Linux binary
      run: dotnet publish ${{ env.App_Project_Path }} -c ${{ matrix.configuration }} -r linux-x64 --self-contained true /p:PublishSingleFile=true -o publish

    - name: Prepare AppDir
      run: |
        mkdir -p ${{ env.App_Name }}.AppDir/usr/bin
        cp publish/${{ env.App_Name }} ${{ env.App_Name }}.AppDir/usr/bin/
        echo -e '#!/bin/bash\nHERE="$(dirname "$(readlink -f "${0}")")"\nexec "$HERE/usr/bin/${{ env.App_Name }}" "$@"' > ${{ env.App_Name }}.AppDir/AppRun
        chmod +x ${{ env.App_Name }}.AppDir/AppRun
        echo -e "[Desktop Entry]\nName=${{ env.App_Name }}\nExec=${{ env.App_Name }}\nType=Application\nCategories=Utility;" > ${{ env.App_Name }}.AppDir/${{ env.App_Name }}.desktop

    - name: Install AppImageTool
      run: |
        wget -O appimagetool.AppImage https://github.com/AppImage/AppImageKit/releases/download/continuous/appimagetool-x86_64.AppImage
        chmod +x appimagetool.AppImage

    - name: Get version from tag
      id: get_version
      run: echo "VERSION=${GITHUB_REF#refs/tags/}" >> $GITHUB_ENV

    - name: Build AppImage
      run: |
        ARCH=x86_64
        ./appimagetool.AppImage ${{ env.App_Name }}.AppDir ${{ env.App_Name }}-${{ env.VERSION }}-$ARCH.AppImage

    - name: Import GPG key (optional)
      if: secrets.GPG_PRIVATE_KEY != ''
      run: |
        echo "${{ secrets.GPG_PRIVATE_KEY }}" | gpg --batch --import
        echo "${{ secrets.GPG_PASSPHRASE }}" > passphrase.txt

    - name: Sign AppImage (optional)
      if: secrets.GPG_PRIVATE_KEY != ''
      run: |
        ARCH=x86_64
        gpg --batch --yes --passphrase-file passphrase.txt --output ${{ env.App_Name }}-${{ env.VERSION }}-$ARCH.AppImage.sig --detach-sign ${{ env.App_Name }}-${{ env.VERSION }}-$ARCH.AppImage

    - name: Create GitHub Release
      uses: softprops/action-gh-release@v1
      with:
        tag_name: ${{ github.ref_name }}
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    - name: Upload AppImage to Release
      uses: softprops/action-gh-release@v1
      with:
        tag_name: ${{ github.ref_name }}
        name: ${{ env.App_Name }}-${{ env.VERSION }}-x86_64.AppImage
        asset_path: ${{ env.App_Name }}-${{ env.VERSION }}-x86_64.AppImage

    - name: Upload signature to Release (optional)
      if: secrets.GPG_PRIVATE_KEY != ''
      uses: softprops/action-gh-release@v1
      with:
        tag_name: ${{ github.ref_name }}
        name: ${{ env.App_Name }}-${{ env.VERSION }}-x86_64.AppImage.sig
        asset_path: ${{ env.App_Name }}-${{ env.VERSION }}-x86_64.AppImage.sig
