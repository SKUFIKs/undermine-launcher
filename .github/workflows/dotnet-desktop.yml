name: Build UnderMine AppImage

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .NET 9
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x

      - name: Restore dependencies
        run: dotnet restore UnderMine.sln

      - name: Publish Linux binary
        run: dotnet publish UnderMine/UnderMine.csproj -c Release -r linux-x64 --self-contained true /p:PublishSingleFile=true -o publish

      - name: Prepare AppDir
        run: |
          mkdir -p UnderMine.AppDir/usr/bin
          cp publish/UnderMine UnderMine.AppDir/usr/bin/
          chmod +x UnderMine.AppDir/usr/bin/UnderMine
          echo -e '#!/bin/bash\nHERE="$(dirname "$(readlink -f "${0}")")"\nexec "$HERE/usr/bin/UnderMine" "$@"' > UnderMine.AppDir/AppRun
          chmod +x UnderMine.AppDir/AppRun
          cp UnderMine/icon.png UnderMine.AppDir/
          echo -e "[Desktop Entry]\nName=UnderMine Launcher\nExec=UnderMine\nIcon=icon\nType=Application\nCategories=Utility;" > UnderMine.AppDir/UnderMine.desktop

      - name: Install AppImageTool (no fuse)
        run: |
          wget -O appimagetool-x86_64.AppImage https://github.com/AppImage/AppImageKit/releases/download/13/appimagetool-x86_64.AppImage
          chmod +x appimagetool-x86_64.AppImage

      - name: Build AppImage
        run: |
          ./appimagetool-x86_64.AppImage --appimage-extract
          ./squashfs-root/AppRun UnderMine.AppDir UnderMine-${GITHUB_REF_NAME}-x86_64.AppImage

      - name: Verify file exists
        run: ls -lh UnderMine-*-x86_64.AppImage

      - name: Create SHA256 checksum
        run: sha256sum UnderMine-*-x86_64.AppImage > UnderMine-${GITHUB_REF_NAME}-x86_64.AppImage.sha256

      - name: Upload AppImage and checksum to Release
        uses: softprops/action-gh-release@v1
        with:
          files: |
            UnderMine-${{ github.ref_name }}-x86_64.AppImage
            UnderMine-${{ github.ref_name }}-x86_64.AppImage.sha256
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
