name: Build UnderMine Launchers

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:  # Для ручного запуска

env:
  APP_NAME: UnderMine

permissions:
  contents: write

jobs:
  build-linux-appimage:
    name: Linux AppImage
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .NET 9
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x

      - name: Restore dependencies
        run: dotnet restore UnderMine.sln

      - name: Publish Linux binary
        run: |
          dotnet publish UnderMine/UnderMine.csproj \
            -c Release -r linux-x64 --self-contained true \
            -p:PublishSingleFile=false -o publish \
            --verbosity detailed

      - name: Debug publish contents
        run: ls -la publish/ && find publish -name "*UnderMine*" -type f

      - name: Prepare AppDir
        run: |
          mkdir -p ${{ env.APP_NAME }}.AppDir/usr/bin
          mkdir -p ${{ env.APP_NAME }}.AppDir/usr/lib

          if [ -f "publish/UnderMine" ]; then
            cp publish/UnderMine ${{ env.APP_NAME }}.AppDir/usr/bin/
          elif [ -f "publish/UnderMine.dll" ]; then
            cp publish/UnderMine.dll ${{ env.APP_NAME }}.AppDir/usr/bin/
          else
            echo "Error: UnderMine binary not found!"
            ls -la publish/
            exit 1
          fi

          cp -r publish/* ${{ env.APP_NAME }}.AppDir/usr/bin/ 2>/dev/null || true  

          if [ -f "UnderMine/icon.png" ]; then
            cp UnderMine/icon.png ${{ env.APP_NAME }}.AppDir/UnderMine.png
          else
            echo "Creating placeholder icon..."
            convert -size 256x256 xc:blue -pointsize 20 -fill white -gravity center -annotate +0+0 "UnderMine" ${{ env.APP_NAME }}.AppDir/UnderMine.png 2>/dev/null || \
            echo "Note: Install ImageMagick for better icons or add icon.png to your project"
          fi

          cat > ${{ env.APP_NAME }}.AppDir/AppRun << 'EOF'
          #!/bin/bash
          HERE="$(dirname "$(readlink -f "${0}")")"
          cd "$HERE/usr/bin"
          exec ./UnderMine "$@"
          EOF
          chmod +x ${{ env.APP_NAME }}.AppDir/AppRun

          # Создаем desktop файл
          cat > ${{ env.APP_NAME }}.AppDir/${{ env.APP_NAME }}.desktop << EOF
          [Desktop Entry]
           Name=${{ env.APP_NAME }}
          Exec=UnderMine
           Icon=UnderMine
           Type=Application
           Categories=Utility;
           EOF

      - name: Install AppImageTool
        run: |
          wget -O appimagetool-x86_64.AppImage https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage
          chmod +x appimagetool-x86_64.AppImage

      - name: Build AppImage
        run: |
          ./appimagetool-x86_64.AppImage ${{ env.APP_NAME }}.AppDir
          ls -la *.AppImage

      - name: Create Release
        uses: softprops/action-gh-release@v1
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: |
            *.AppImage
            *.sha256
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-linux-tar:
    name: Linux AMD64 tar.gz
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .NET 9
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x

      - name: Restore dependencies
        run: dotnet restore UnderMine.sln

      - name: Publish Linux binary (multi-file)
        run: |
          dotnet publish UnderMine/UnderMine.csproj \
            -c Release -r linux-x64 --self-contained true \
            -p:PublishSingleFile=false -o publish

      - name: Package tar.gz
        run: |
          mkdir -p UnderMine-linux
          cp -r publish/* UnderMine-linux/
          cp UnderMine/icon.png UnderMine-linux/
          tar -czvf UnderMine-${GITHUB_REF_NAME}-linux-x64.tar.gz UnderMine-linux

      - name: Upload tar.gz
        uses: softprops/action-gh-release@v1
        with:
          files: UnderMine-${{ github.ref_name }}-linux-x64.tar.gz
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-macos-zip:
    name: macOS ZIP
    runs-on: macos-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .NET 9
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x

      - name: Restore dependencies
        run: dotnet restore UnderMine.sln

      - name: Publish macOS binary (multi-file)
        run: |
          dotnet publish UnderMine/UnderMine.csproj \
            -c Release -r osx-x64 --self-contained true \
            -p:PublishSingleFile=false -o publish

      - name: Package ZIP
        run: |
          mkdir -p UnderMine-macos
          cp -r publish/* UnderMine-macos/
          cp UnderMine/icon.png UnderMine-macos/
          zip -r UnderMine-${GITHUB_REF_NAME}-macos-x64.zip UnderMine-macos

      - name: Upload ZIP
        uses: softprops/action-gh-release@v1
        with:
          files: UnderMine-${{ github.ref_name }}-macos-x64.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

