name: Build UnderMine Launchers

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-linux-appimage:
    name: Linux AppImage
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .NET 9
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x

      - name: Restore dependencies
        run: dotnet restore UnderMine.sln

      - name: Publish Linux binary
        run: dotnet publish UnderMine/UnderMine.csproj -c Release -r linux-x64 --self-contained true /p:PublishSingleFile=true -o publish

      - name: Prepare AppDir
        run: |
          mkdir -p UnderMine.AppDir/usr/bin
          cp publish/UnderMine UnderMine.AppDir/usr/bin/
          chmod +x UnderMine.AppDir/usr/bin/UnderMine
          echo -e '#!/bin/bash\nHERE="$(dirname "$(readlink -f "${0}")")"\nexec "$HERE/usr/bin/UnderMine" "$@"' > UnderMine.AppDir/AppRun
          chmod +x UnderMine.AppDir/AppRun
          cp UnderMine/icon.png UnderMine.AppDir/
          echo -e "[Desktop Entry]\nName=UnderMine Launcher\nExec=UnderMine\nIcon=icon\nType=Application\nCategories=Utility;" > UnderMine.AppDir/UnderMine.desktop

      - name: Install AppImageTool
        run: |
          wget -O appimagetool-x86_64.AppImage https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage
          chmod +x appimagetool-x86_64.AppImage

      - name: Build AppImage
        run: |
          ./appimagetool-x86_64.AppImage --appimage-extract
          ./squashfs-root/AppRun UnderMine.AppDir UnderMine-${GITHUB_REF_NAME}-x86_64.AppImage

      - name: Create SHA256 checksum
        run: sha256sum UnderMine-*-x86_64.AppImage > UnderMine-${GITHUB_REF_NAME}-x86_64.AppImage.sha256

      - name: Upload AppImage
        uses: softprops/action-gh-release@v1
        with:
          files: |
            UnderMine-${{ github.ref_name }}-x86_64.AppImage
            UnderMine-${{ github.ref_name }}-x86_64.AppImage.sha256
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-linux-tar:
    name: Linux AMD64 tar.gz
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .NET 9
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x

      - name: Publish Linux AMD64 binary
        run: dotnet publish UnderMine/UnderMine.csproj -c Release -r linux-x64 --self-contained true /p:PublishSingleFile=true -o publish

      - name: Package tar.gz
        run: |
          mkdir -p UnderMine-linux
          cp publish/UnderMine UnderMine-linux/
          cp UnderMine/icon.png UnderMine-linux/
          tar -czvf UnderMine-${GITHUB_REF_NAME}-linux-x64.tar.gz UnderMine-linux

      - name: Upload tar.gz
        uses: softprops/action-gh-release@v1
        with:
          files: UnderMine-${{ github.ref_name }}-linux-x64.tar.gz
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-macos-zip:
    name: macOS ZIP
    runs-on: macos-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .NET 9
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x

      - name: Restore dependencies
        run: dotnet restore UnderMine.sln

      - name: Publish macOS binary
        run: dotnet publish UnderMine/UnderMine.csproj -c Release -r osx-x64 --self-contained true /p:PublishSingleFile=true -o publish

      - name: Package ZIP
        run: |
          mkdir -p UnderMine-macos
          cp publish/UnderMine UnderMine-macos/
          cp UnderMine/icon.png UnderMine-macos/
          zip -r UnderMine-${GITHUB_REF_NAME}-macos-x64.zip UnderMine-macos

      - name: Upload ZIP
        uses: softprops/action-gh-release@v1
        with:
          files: UnderMine-${{ github.ref_name }}-macos-x64.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
