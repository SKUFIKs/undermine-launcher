name: Build UnderMine Launchers

on:
  push:
    tags:
      - 'v*'

env:
  App_Name: UnderMine

permissions:
  contents: write

jobs:
  build-linux-appimage:
    name: Linux AppImage
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .NET 9
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x

      - name: Restore dependencies
        run: dotnet restore UnderMine.sln

      - name: Add SkiaSharp.NativeAssets.Linux
        run: dotnet add UnderMine/UnderMine.csproj package SkiaSharp.NativeAssets.Linux

      - name: Publish Linux binary (multi-file)
        run: |
          dotnet publish UnderMine/UnderMine.csproj \
            -c Release -r linux-x64 --self-contained true \
            -p:PublishSingleFile=false -o publish

      - name: Prepare AppDir
        run: |
          mkdir -p ${{ env.App_Name }}.AppDir/usr/bin
          mkdir -p ${{ env.App_Name }}.AppDir/usr/lib
          cp publish/${{ env.App_Name }} ${{ env.App_Name }}.AppDir/usr/bin/
          cp publish/runtimes/linux-x64/native/libSkiaSharp.so* ${{ env.App_Name }}.AppDir/usr/lib/
          echo -e '#!/bin/bash\nHERE="$(dirname "$(readlink -f "${0}")")"\nexport LD_LIBRARY_PATH="$HERE/usr/lib:$LD_LIBRARY_PATH"\nexec "$HERE/usr/bin/${{ env.App_Name }}" "$@"' > ${{ env.App_Name }}.AppDir/AppRun
          chmod +x ${{ env.App_Name }}.AppDir/AppRun
          echo -e "[Desktop Entry]\nName=${{ env.App_Name }}\nExec=${{ env.App_Name }}\nType=Application\nCategories=Utility;" > ${{ env.App_Name }}.AppDir/${{ env.App_Name }}.desktop

      - name: Install AppImageTool
        run: |
          wget -O appimagetool-x86_64.AppImage https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage
          chmod +x appimagetool-x86_64.AppImage

      - name: Build AppImage
        run: ./appimagetool-x86_64.AppImage ${{ env.App_Name }}.AppDir UnderMine-${GITHUB_REF_NAME}-x86_64.AppImage

      - name: Create SHA256 checksum
        run: sha256sum UnderMine-*-x86_64.AppImage > UnderMine-${GITHUB_REF_NAME}-x86_64.AppImage.sha256

      - name: Upload AppImage
        uses: softprops/action-gh-release@v1
        with:
          files: |
            UnderMine-${{ github.ref_name }}-x86_64.AppImage
            UnderMine-${{ github.ref_name }}-x86_64.AppImage.sha256
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-linux-tar:
    name: Linux AMD64 tar.gz
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .NET 9
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x

      - name: Restore dependencies
        run: dotnet restore UnderMine.sln

      - name: Publish Linux binary (multi-file)
        run: |
          dotnet publish UnderMine/UnderMine.csproj \
            -c Release -r linux-x64 --self-contained true \
            -p:PublishSingleFile=false -o publish

      - name: Package tar.gz
        run: |
          mkdir -p UnderMine-linux
          cp -r publish/* UnderMine-linux/
          cp UnderMine/icon.png UnderMine-linux/
          tar -czvf UnderMine-${GITHUB_REF_NAME}-linux-x64.tar.gz UnderMine-linux

      - name: Upload tar.gz
        uses: softprops/action-gh-release@v1
        with:
          files: UnderMine-${{ github.ref_name }}-linux-x64.tar.gz
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-macos-zip:
    name: macOS ZIP
    runs-on: macos-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .NET 9
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x

      - name: Restore dependencies
        run: dotnet restore UnderMine.sln

      - name: Publish macOS binary (multi-file)
        run: |
          dotnet publish UnderMine/UnderMine.csproj \
            -c Release -r osx-x64 --self-contained true \
            -p:PublishSingleFile=false -o publish

      - name: Package ZIP
        run: |
          mkdir -p UnderMine-macos
          cp -r publish/* UnderMine-macos/
          cp UnderMine/icon.png UnderMine-macos/
          zip -r UnderMine-${GITHUB_REF_NAME}-macos-x64.zip UnderMine-macos

      - name: Upload ZIP
        uses: softprops/action-gh-release@v1
        with:
          files: UnderMine-${{ github.ref_name }}-macos-x64.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
