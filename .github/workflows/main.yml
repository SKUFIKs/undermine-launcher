name: Build Linux Packages

on:
  push:
    branches: [ master ]
  workflow_dispatch:

jobs:
  build-linux:
    name: Build AppImage & DEB
    runs-on: ubuntu-latest

    steps:
      - name: 🧱 Checkout repository
        uses: actions/checkout@v4

      - name: ⚙️ Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: 🏗️ Publish .NET app
        run: |
          dotnet publish -c Release -r linux-x64 --self-contained true -o publish

      - name: 📦 Install dependencies
        run: |
          sudo apt update
          sudo apt install -y wget dpkg-dev libfuse2
          wget https://github.com/AppImage/AppImageKit/releases/download/continuous/appimagetool-x86_64.AppImage
          chmod +x appimagetool-x86_64.AppImage
          sudo mv appimagetool-x86_64.AppImage /usr/local/bin/appimagetool

      - name: 🧰 Build AppImage & DEB
        run: |
          chmod +x UnderMine/build-packages.sh
          ./UnderMine/build-packages.sh

      # ───────────── Подпись Cosign ─────────────
      - name: 🔐 Install Cosign
        run: |
          curl -Lo cosign https://github.com/sigstore/cosign/releases/latest/download/cosign-linux-amd64
          chmod +x cosign
          sudo mv cosign /usr/local/bin/

      - name: ✍️ Sign AppImage & DEB
        env:
          COSIGN_EXPERIMENTAL: "1"
        run: |
         for file in ./*.AppImage ./*.deb; do
         echo "Signing $file ..."
         cosign sign --keyless "$file"
         done

      # ───────────── Загрузка артефактов и подписей ─────────────
      - name: 📤 Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: UnderMineLauncher-Linux
          path: |
            ./*.AppImage
            ./*.AppImage.sig
            ./*.deb
            ./*.deb.sig
