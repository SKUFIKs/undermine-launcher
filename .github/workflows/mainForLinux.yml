name: Build Debian Package

on: [push, pull_request]

env:
  APP_NAME: UnderMine
  VERSION: 1.0.0

jobs:
  build-debian:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Setup .NET
      uses: actions/setup-dotnet@v3
      with:
        dotnet-version: '9.0.x'
        
    - name: Install dependencies
      run: |
        sudo apt update
        sudo apt install -y dpkg
        
    - name: Publish Application
      run: |
        dotnet publish -c Release -r linux-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -o ./publish-linux
        
    - name: Create staging directory structure
      run: |
        rm -rf ./staging_folder
        rm -rf ./deb-package
        mkdir -p ./staging_folder/DEBIAN
        mkdir -p ./staging_folder/usr/bin
        mkdir -p ./staging_folder/usr/lib/undermine
        mkdir -p ./staging_folder/usr/share/applications
        mkdir -p ./staging_folder/usr/share/pixmaps
        
    - name: Create control file
      run: |
        cat << EOF > ./staging_folder/DEBIAN/control
         Package: undermine
         Version: ${{ env.VERSION }}
         Section: devel
         Priority: optional
         Architecture: amd64
         Depends: libc6, libstdc++6, zlib1g
         Maintainer: SKUF <undermine@example.com>
         Description: UnderMine Minecraft Bot
         A Minecraft underground bot application for automation.
         EOF
        
    - name: Create starter script
      run: |
        cat > ./staging_folder/usr/bin/undermine << 'EOF'
         #!/bin/bash
        exec /usr/lib/undermine/UnderMine "$@"
        EOF
        chmod +x ./staging_folder/usr/bin/undermine
        
    - name: Copy application files
      run: |
        cp -r ./publish-linux/* ./staging_folder/usr/lib/undermine/
        chmod -R a+rX ./staging_folder/usr/lib/undermine/
        chmod +x ./staging_folder/usr/lib/undermine/UnderMine
        
    - name: Create desktop file
      run: |
        cat > ./staging_folder/usr/share/applications/undermine.desktop << EOF
         [Desktop Entry]
        Name=UnderMine
        Comment=Minecraft underground bot application
        Icon=undermine
        Exec=undermine
        Type=Application
        Categories=Game;
        EOF
        
    - name: Copy icon (if exists)
      run: |
        if [ -f "./icon.png" ]; then
          cp ./icon.png ./staging_folder/usr/share/pixmaps/undermine.png
          echo "Icon copied successfully"
        else
          echo "No icon found, skipping"
        fi
        
    - name: Build .deb package
      run: |
        mkdir -p ./deb-package
        dpkg-deb --build ./staging_folder/ "./deb-package/undermine_${{ env.VERSION }}_amd64.deb"
        
    - name: Verify .deb package
      run: |
        cd ./deb-package
        dpkg -c *.deb
        dpkg -I *.deb
        
    - name: Upload Debian Package
      uses: actions/upload-artifact@v4
      with:
        name: UnderMine-Debian
        path: deb-package/
        retention-days: 7
