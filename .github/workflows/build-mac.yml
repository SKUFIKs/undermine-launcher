name: Build & Sign macOS DMG

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  id-token: write   # нужно для keyless-подписи через GitHub OIDC
  contents: read

jobs:
  build-mac:
    name: Build, Sign & Upload (macOS DMG)
    runs-on: macos-latest

    steps:
      - name: 🧱 Checkout repository
        uses: actions/checkout@v4

      - name: 🧰 Print working directory
        run: pwd

      - name: 📂 List repo files
        run: ls -R

      - name: 🏗️ Make build script executable
        run: chmod +x ./UnderMine/scripts/build-mac.sh

      - name: 🚀 Run build script
        run: ./UnderMine/scripts/build-mac.sh

      - name: 🔏 Download and Setup Cosign
        run: |
          curl -Lo cosign https://github.com/sigstore/cosign/releases/latest/download/cosign-darwin-amd64
          chmod +x cosign
          sudo mv cosign /usr/local/bin/cosign

      - name: 🔐 Sign DMG artifacts with GitHub OIDC (Cosign keyless)
        env:
          COSIGN_EXPERIMENTAL: "true"
        run: |
          for file in ./publish/dmg/*.dmg; do
            if [ -f "$file" ]; then
              echo "🔏 Signing $file ..."
              cosign sign-blob "$file" \
                --yes \
                --bundle "$file.bundle.json" \
                --output-signature "$file.sig"
            fi
          done

      - name: 📤 Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: mac-build-signed
          path: |
            ./publish/dmg/*.dmg
            ./publish/dmg/*.sig
            ./publish/dmg/*.bundle.json
