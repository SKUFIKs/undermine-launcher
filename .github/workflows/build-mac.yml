name: Build macOS

on:
  push:
    branches: [ master ]
  tags: [ 'v*' ]

env:
  DOTNET_VERSION: '9.0.x'

jobs:
  build-mac:
    runs-on: macos-latest
    
    steps:
    - name: Checkout
      uses: actions/checkout@v4
      
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: ${{ env.DOTNET_VERSION }}
        
    - name: Publish app
      run: |
        dotnet publish UnderMine/UnderMine.csproj -c Release -r osx-x64 \
          --self-contained true \
          -p:PublishSingleFile=true \
          -o publish/osx-x64
          
    - name: Create .app
      run: |
        mkdir -p dist/UnderMine.app/Contents/MacOS
        mkdir -p dist/UnderMine.app/Contents/Resources
        cp -r publish/osx-x64/* dist/UnderMine.app/Contents/MacOS/
        chmod +x dist/UnderMine.app/Contents/MacOS/UnderMine
        
        cat > dist/UnderMine.app/Contents/Info.plist << EOF
        <?xml version="1.0" encoding="UTF-8"?>
        <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
        <plist version="1.0">
        <dict>
            <key>CFBundleName</key>
            <string>UnderMine</string>
            <key>CFBundleDisplayName</key>
            <string>UnderMine Launcher</string>
            <key>CFBundleIdentifier</key>
            <string>com.UndergroundUrFU.undermine</string>
            <key>CFBundleVersion</key>
            <string>1.0.0</string>
            <key>CFBundleExecutable</key>
            <string>UnderMine</string>
            <key>CFBundlePackageType</key>
            <string>APPL</string>
            <key>NSHighResolutionCapable</key>
            <true/>
          </dict>
          </plist>
          EOF

    - name: Create DMG
      run: |
        hdiutil create \
          -volname "UnderMine Installer" \
          -srcfolder dist/UnderMine.app \
          -ov -format UDZO \
          dist/UnderMine.dmg

    - name: Upload to Release
      if: startsWith(github.ref, 'refs/tags/')
      uses: softprops/action-gh-release@v1
      with:
        files: |
          dist/UnderMine.dmg
