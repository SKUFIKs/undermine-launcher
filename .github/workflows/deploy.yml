name: Build and Release Launcher

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    name: Build for ${{ matrix.os_name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            os_name: Windows
            rid: win-x64
            extension: .exe
            
          - os: ubuntu-latest
            os_name: Linux
            rid: linux-x64
            extension: ""
            
          - os: macos-latest
            os_name: MacOS-AppleSilicon
            rid: osx-arm64
            extension: ""

          - os: macos-13
            os_name: MacOS-Intel
            rid: osx-x64
            extension: ""

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup .NET 9
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 9.0.x

    # Сборка приложения
    # Путь ./UnderMine/UnderMine.csproj оставлен, чтобы избежать ошибки Ambiguous project name
    - name: Publish
      run: |
        dotnet publish ./UnderMine/UnderMine.csproj -c Release -r ${{ matrix.rid }} --self-contained true -p:PublishSingleFile=true -p:AssemblyName=UnderMine -o ./publish

    # --- ОЧИСТКА МУСОРА (Windows) ---
    - name: Clean up junk (Windows)
      if: matrix.os == 'windows-latest'
      run: |
        Remove-Item -Path ./publish/*.pdb -ErrorAction SilentlyContinue
        Remove-Item -Path ./publish/runtimes -Recurse -ErrorAction SilentlyContinue
        # Удаляем лишние папки архитектур
        Remove-Item -Path ./publish/linux-x64 -Recurse -ErrorAction SilentlyContinue
        Remove-Item -Path ./publish/osx-x64 -Recurse -ErrorAction SilentlyContinue
        Remove-Item -Path ./publish/osx-arm64 -Recurse -ErrorAction SilentlyContinue
        Remove-Item -Path ./publish/win-x64 -Recurse -ErrorAction SilentlyContinue

    # --- ОЧИСТКА МУСОРА (Linux/Mac) ---
    - name: Clean up junk (Unix)
      if: matrix.os != 'windows-latest'
      run: |
        rm -f ./publish/*.pdb
        rm -rf ./publish/runtimes
        rm -rf ./publish/linux-x64
        rm -rf ./publish/win-x64
        rm -rf ./publish/osx-x64
        rm -rf ./publish/osx-arm64
        rm -rf ./publish/arm64

    # --- Windows: Создание ZIP архива ---
    - name: Pack Windows (Zip)
      if: matrix.os == 'windows-latest'
      run: |
        Compress-Archive -Path ./publish/* -DestinationPath ./UnderMine-${{ matrix.rid }}.zip

    # --- Linux/Mac: Создание TAR.GZ ---
    - name: Pack Unix
      if: matrix.os != 'windows-latest'
      run: |
        chmod +x ./publish/UnderMine*
        tar -czvf UnderMine-${{ matrix.rid }}.tar.gz -C ./publish .

    # --- Загрузка файлов в Релиз (Windows) ---
    # Теперь загружаем ТОЛЬКО ZIP
    - name: Upload Release Asset (Windows)
      if: matrix.os == 'windows-latest'
      uses: softprops/action-gh-release@v1
      with:
        files: ./UnderMine-${{ matrix.rid }}.zip
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    # --- Загрузка файлов в Релиз (Linux/Mac) ---
    - name: Upload Release Asset (Unix)
      if: matrix.os != 'windows-latest'
      uses: softprops/action-gh-release@v1
      with:
        files: ./UnderMine-${{ matrix.rid }}.tar.gz
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
